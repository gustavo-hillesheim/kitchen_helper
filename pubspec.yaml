name: kitchen_helper
description: App intended to help owner of autonomous kitchens to calculate their expenses and profits.

publish_to: "none"

version: 1.3.8+17

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  json_annotation: ^4.3.0
  fpdart: ^1.1.1
  synchronized: ^3.0.0
  sqflite: ^2.0.0+4
  path: ^1.8.0
  path_provider: ^2.0.7
  equatable: ^2.0.3
  flutter_modular: ^6.0.0
  bloc: ^9.0.0
  flutter_slidable: ^4.0.0
  multi_value_listenable_builder: ^0.0.2
  intl: ^0.19.0
  datetime_picker_formfield: ^2.0.0
  auto_size_text: ^3.0.0
  device_preview: ^1.0.0
  sqflite_common_ffi: ^2.1.0+2
  build_runner: ^2.1.7
  dio: ^5.8.0+1
  firebase_crashlytics: ^4.3.4
  firebase_core: ^3.12.1
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  code_coverage: ^1.4.0
  json_serializable: ^6.0.1
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  
flutter:
  uses-material-design: true

  assets:
    - assets/splash_icon.png

flutter_icons:
  android: true
  image_path: "assets/splash_icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/splash_icon.png"

flutter_native_splash:
  color: "#2196F3"
  image: "assets/splash_icon.png"
